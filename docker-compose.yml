name: legacy

services:
  legacy-db:
    image: mariadb:10.6
    container_name: legacy-db
    environment:
      MARIADB_DATABASE: soms
      MARIADB_USER: soms
      MARIADB_PASSWORD: soms_pass
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/my.cnf:/etc/mysql/conf.d/legacy.cnf:ro
      - ./docker/db/000-pre-baseline.sql:/docker-entrypoint-initdb.d/000-pre-baseline.sql:ro
      - ${LEGACY_BASELINE:-../eisf/docker/db/baseline.sql.gz}:/baseline/baseline.sql.gz:ro
      - ./docker/db/001-baseline.sh:/docker-entrypoint-initdb.d/001-baseline.sh:ro
      - ./docker/db/002-local-setup.sql:/docker-entrypoint-initdb.d/002-local-setup.sql:ro
    ports:
      - '127.0.0.1:${LEGACY_DB_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -u root -proot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      # First start imports the baseline before the server accepts TCP connections.
      start_period: 60m

  legacy-soms:
    build:
      context: ./soms
      dockerfile: .docker/pr-image/Dockerfile
      secrets:
        - composer_auth
    image: legacy-soms
    container_name: legacy-soms
    environment:
      PR_DB_HOST: legacy-db
      PR_DB_PORT: '3306'
      PR_DB_NAME: soms
      PR_DB_USER: soms
      PR_DB_PASS: soms_pass
    depends_on:
      legacy-db:
        condition: service_healthy
    volumes:
      - ./docker/soms/http.conf:/etc/nginx/conf.d/default.conf:ro
      - soms_sessions:/srv/http/ctms/soms/sessions
      - soms_documents:/srv/http/ctms/soms/documents
    ports:
      - '${LEGACY_SOMS_PORT:-8081}:443'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/healthcheck']
      interval: 5s
      timeout: 5s
      retries: 30

secrets:
  composer_auth:
    file: ./docker/secrets/composer_auth

volumes:
  db_data:
  soms_sessions:
  soms_documents:
