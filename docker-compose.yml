name: legacy

services:
  legacy-db:
    image: mariadb:10.6
    container_name: legacy-db
    environment:
      MARIADB_DATABASE: soms
      MARIADB_USER: soms
      MARIADB_PASSWORD: soms_pass
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/my.cnf:/etc/mysql/conf.d/legacy.cnf:ro
      - ./docker/db/000-pre-baseline.sql:/docker-entrypoint-initdb.d/000-pre-baseline.sql:ro
      - ${LEGACY_BASELINE:-../eisf/docker/db/baseline.sql.gz}:/baseline/baseline.sql.gz:ro
      - ./docker/db/001-baseline.sh:/docker-entrypoint-initdb.d/001-baseline.sh:ro
      - ./docker/db/002-local-setup.sql:/docker-entrypoint-initdb.d/002-local-setup.sql:ro
    ports:
      - '127.0.0.1:${LEGACY_DB_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -u root -proot --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      # First start imports the baseline before the server accepts TCP connections.
      start_period: 60m

  # The unmodified SOMS image, built from soms/.docker/pr-image/Dockerfile.
  # Build-only (never started): legacy-soms layers docker/soms/Dockerfile on top.
  legacy-soms-base:
    build:
      context: ./soms
      dockerfile: .docker/pr-image/Dockerfile
      args:
        # Keep node_modules in the image so js.sh can run webpack in the container.
        KEEP_JS_DEPS: '1'
      secrets:
        - composer_auth
        - design_system_token
    image: legacy-soms-base
    scale: 0

  legacy-soms:
    build:
      context: ./docker/soms
      additional_contexts:
        base: service:legacy-soms-base
      labels:
        # Hash of the dependency files the image was built from (set by up.sh). up.sh
        # rebuilds only when it no longer matches the checkout.
        legacy.deps-hash: ${LEGACY_DEPS_HASH:-}
    image: legacy-soms
    container_name: legacy-soms
    environment:
      PR_DB_HOST: legacy-db
      PR_DB_PORT: '3306'
      PR_DB_NAME: soms
      PR_DB_USER: soms
      PR_DB_PASS: soms_pass
    depends_on:
      legacy-db:
        condition: service_healthy
    volumes:
      - ./docker/soms/http.conf:/etc/nginx/conf.d/default.conf:ro
      # The checkout is mounted over the code baked into the image, so PHP edits are live.
      # Dependencies stay in named volumes, filled from the image the first time they're
      # mounted; up.sh drops them whenever it rebuilds the image.
      - ./soms:/srv/http/ctms/soms
      - soms_vendor:/srv/http/ctms/soms/vendor
      - soms_node_modules:/srv/http/ctms/soms/node_modules
      - soms_esource_node_modules:/srv/http/ctms/soms/app/js/esource/node_modules
      - soms_web_integration_node_modules:/srv/http/ctms/soms/app/js/web-integration/node_modules
      - soms_sessions:/srv/http/ctms/soms/sessions
      - soms_documents:/srv/http/ctms/soms/documents
    ports:
      - '${LEGACY_SOMS_PORT:-8081}:443'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/healthcheck']
      interval: 5s
      timeout: 5s
      retries: 30

secrets:
  composer_auth:
    file: ./docker/secrets/composer_auth
  design_system_token:
    file: ./docker/secrets/design_system_token

volumes:
  db_data:
  soms_vendor:
  soms_node_modules:
  soms_esource_node_modules:
  soms_web_integration_node_modules:
  soms_sessions:
  soms_documents:
